name: Bug report
description: Report reproducible KHapiMAN behavior that is incorrect or unsafe.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Use [GitHub private vulnerability reporting](https://github.com/noviantia/KHapiMAN/security/advisories/new). Never paste a real API key, an unredacted backup, or private customer data.

  - type: input
    id: version
    attributes:
      label: KHapiMAN version
      description: Output of `khapiman --version`.
      placeholder: 1.0.0
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: v22.x.x
    validations:
      required: true

  - type: dropdown
    id: tool
    attributes:
      label: Affected tool
      options:
        - Codex CLI
        - Claude Code
        - OpenCode
        - Aider
        - KHapiMAN core / multiple tools
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Explain what happened and include redacted output if useful.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Use a temporary KHAPIMAN_HOME and fake key where possible; the relay endpoint is fixed by the product.
      placeholder: |
        1. Set KHAPIMAN_HOME to ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Redacted doctor output
      description: Output of `khapiman doctor --json`, after removing private identifiers.
      render: json

  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed real keys, profile identifiers, local paths and private customer data from this report.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true

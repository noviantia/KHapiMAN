name: Publish KHapiMAN to npm

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.event.release.tag_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11

      - name: Verify release tag
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version v${package_version}." >&2
            exit 1
          fi

      - name: Verify dependency sources
        run: node scripts/check-lockfile-hosts.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run checks, build, and inspect package branding
        run: npm run check

      - name: Verify built CLI version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          cli_version="$(node dist/cli.js --version)"
          if [[ "${cli_version}" != "${package_version}" ]]; then
            echo "Built CLI version ${cli_version} does not match package version ${package_version}." >&2
            exit 1
          fi

      - name: Inspect package
        run: npm pack --dry-run

      - name: Publish with provenance
        run: npm publish --access public --provenance
